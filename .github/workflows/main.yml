name: Windows portable
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: msys2/setup-msys2@v2
        id: msys
        with:
          msystem: UCRT64
          update: false
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-git
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-nasm
            patch
            unzip
      - name: Install Lazarus 4.8 and Free Pascal 3.2.2
        shell: pwsh
        run: |
          $url = 'https://netix.dl.sourceforge.net/project/lazarus/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe'
          curl.exe --fail --location --retry 3 --max-time 600 --silent --show-error $url --output "$env:RUNNER_TEMP/lazarus.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer download failed: $LASTEXITCODE" }
          $hash = (Get-FileHash "$env:RUNNER_TEMP/lazarus.exe" -Algorithm SHA256).Hash
          if ($hash -ne 'ed25ee171d55e23cf14e0633159fdd2325efba56e186f8ab817ad3bf97d267d7') { throw 'Installer checksum mismatch' }
          $p = Start-Process "$env:RUNNER_TEMP/lazarus.exe" -ArgumentList '/SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=C:\lazarus' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Cache DLLs
        id: cache-dlls
        uses: actions/cache@v6
        with:
          path: dists/windows/prefix
          key: windows-dlls-${{ hashFiles('dists/windows/tasks.sh') }}
      - name: Build DLLs
        if: steps.cache-dlls.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: make -C dists/windows
      - name: Install DLLs
        shell: msys2 {0}
        run: |
          touch -d @0 dists/windows/tasks.sh
          make -C dists/windows install
      - name: Build Windows x64
        shell: pwsh
        run: ./tools/windows/build.ps1 -Configuration Release -MsysRoot '${{ steps.msys.outputs.msys2-location }}'
      - name: Package portable game
        shell: pwsh
        run: ./tools/windows/package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v6
        with:
          name: LisiaNora-USDX-windows-x64
          path: artifacts/*.zip
          if-no-files-found: error
